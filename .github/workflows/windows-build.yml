name: Windows Desktop Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Build Windows desktop artifacts
        run: npm run desktop:win

      - name: List packaged files
        run: |
          echo "Release directory contents:"
          dir release /s

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts-${{ github.sha }}
          path: |
            release/**/*.exe
            release/**/*.nsis.*
            release/**/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish nightly release tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly-windows -m "p0stmaster Windows nightly"
          git push origin refs/tags/nightly-windows --force

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: release/**/*.exe,release/**/*.zip
          body: |
            Automated nightly Windows build for commit ${{ github.sha }}.
          makeLatest: false
          name: p0stmaster ${{ github.sha }} Windows nightly
          prerelease: true
          replacesArtifacts: true
          tag: nightly-windows

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: release/**/*.exe,release/**/*.zip
          generateReleaseNotes: true
          makeLatest: true
          name: p0stmaster ${{ github.ref_name }}
          prerelease: false
          replacesArtifacts: true
          tag: ${{ github.ref_name }}
