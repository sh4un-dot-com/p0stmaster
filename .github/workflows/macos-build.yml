name: Desktop Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS desktop artifacts
        run: npm run desktop:mac

      - name: List packaged files
        run: |
          echo "Release directory contents:"
          ls -R release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts-${{ github.sha }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop artifacts
        run: npm run desktop:win

      - name: List packaged files
        run: |
          echo "Release directory contents:"
          dir release /s

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts-${{ github.sha }}
          path: |
            release/**/*.exe
            release/**/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Download macOS artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-artifacts-${{ github.sha }}
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: windows-artifacts-${{ github.sha }}
          path: artifacts/windows

      - name: Read package version
        id: package_version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update nightly release tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly-macos -m "p0stmaster macOS nightly"
          git tag -fa nightly-windows -m "p0stmaster Windows nightly"
          git push origin refs/tags/nightly-macos --force
          git push origin refs/tags/nightly-windows --force

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: artifacts/**/*.dmg,artifacts/**/*.zip,artifacts/**/*.blockmap,artifacts/**/*.exe
          body: |
            Automated nightly desktop build for commit ${{ github.sha }}.
          makeLatest: false
          name: p0stmaster ${{ steps.package_version.outputs.version }} desktop nightly
          prerelease: true
          replacesArtifacts: true
          tag: nightly-desktop

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: artifacts/**/*.dmg,artifacts/**/*.zip,artifacts/**/*.blockmap,artifacts/**/*.exe
          generateReleaseNotes: true
          makeLatest: true
          name: p0stmaster ${{ github.ref_name }}
          prerelease: false
          replacesArtifacts: true
          tag: ${{ github.ref_name }}
