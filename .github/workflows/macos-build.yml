name: macOS Desktop Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package_version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build macOS desktop artifacts
        run: npm run desktop:mac

      - name: List packaged files
        run: |
          echo "Release directory contents:"
          ls -R release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts-${{ github.sha }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Update nightly release tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly-macos -m "p0stmaster macOS nightly"
          git push origin refs/tags/nightly-macos --force

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: release/**/*.dmg,release/**/*.zip,release/**/*.blockmap
          body: |
            Automated nightly macOS build for commit ${{ github.sha }}.
          makeLatest: false
          name: p0stmaster ${{ steps.package_version.outputs.version }} macOS nightly
          prerelease: true
          replacesArtifacts: true
          tag: nightly-macos

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: release/**/*.dmg,release/**/*.zip,release/**/*.blockmap
          generateReleaseNotes: true
          makeLatest: true
          name: p0stmaster ${{ github.ref_name }}
          prerelease: false
          replacesArtifacts: true
          tag: ${{ github.ref_name }}
